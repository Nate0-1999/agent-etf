version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_etf
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.27.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    ports:
      - "8080:8080"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - APPROVAL_STEP3_COOLDOWN_SECONDS=600
      - AUDIT_MAX_RETRY_LOOPS=3
    ports:
      - "8000:8000"
    depends_on:
      - temporal
      - postgres

  worker:
    build:
      context: .
      dockerfile: workers/temporal/Dockerfile
    environment:
      - TEMPORAL_TARGET=temporal:7233
    depends_on:
      - temporal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
